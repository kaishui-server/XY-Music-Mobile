[package]
name = "xymusic_core"
version = "0.1.0"
description = "XY Music 移动端复用核心（从桌面端抽取的纯逻辑，不依赖 Tauri）"
authors = ["lyc"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "xymusic_core"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
amll-lyric = "0.3.0"
regex = "1"
sha1 = "0.10"
hex = "0.4"
md5 = "0.7"
urlencoding = "2"
reqwest = { version = "0.12.26", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "blocking", "json"] }
tokio = { version = "1.48.0", features = ["sync", "rt-multi-thread", "time", "macros", "fs", "io-util"] }
rustfft = "6.4.1"
base64 = "0.22.1"
rusqlite = { version = "0.38.0", features = ["bundled"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
encoding_rs = "0.8"
thiserror = "2"
id3 = "1.14"
lofty = "0.21"
flutter_rust_bridge = "=2.12.0"
flate2 = "1"
aes = "0.8"
sha2 = "0.10"
quick-xml = "0.39.2"
rayon = "1.10"
walkdir = "2"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "adpcm", "aiff", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# AC-4 本地解码（vendored baka-ac4，GPL-3.0-or-later，与本项目 AGPL-3.0 兼容）：
# core 为纯解码器，cli 提供 MP4/裸流 demux 与 WavWriter（wav 模块为 XY 导出）。
baka-ac4-core = { path = "vendor/baka-ac4/crates/baka-ac4-core" }
baka-ac4-cli = { path = "vendor/baka-ac4/crates/baka-ac4-cli" }
# AV3A 本地解码（vendored baka-av3a，同 GPL-3.0-or-later）：core 为解码器
# （需运行时传入 model/lsf 参数资产路径），container 提供 MP4 demux。
baka-av3a-core = { path = "vendor/baka-av3a/crates/baka-av3a-core" }
baka-av3a-container = { path = "vendor/baka-av3a/crates/baka-av3a-container" }

# symphonia-utils-xiph 本地补丁（MPL-2.0，上游 0.5.5 + XY 扩展）：Vorbis
# >8 声道流（QQ 空间音质 galaxy714/916 的 12/16ch OGG-Vorbis）在声道映射
# 表里返回 None 导致解码器拒绝初始化；按声位占位扩展到 16ch，配合
# channel_downmix 泛化下混。补丁仅扩展 9..=16 声道，1..=8 行为不变。
[patch.crates-io]
symphonia-utils-xiph = { path = "vendor/symphonia-utils-xiph" }

[build-dependencies]
# 编译 anime 音效引擎（src/player/animefx.c，官方开放平台源码）
cc = "1"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[profile.dev]
# 与桌面端保持一致：DSP/FFT 热路径在 opt-level=0 下较慢
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
# 保持音频/DSP 热路径的优化级别，同时通过跨 crate 优化和符号裁剪缩小
# Android 动态库。fat LTO 比 thin 能进一步削减跨 crate 冗余代码。
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

# 【体积控制】第三方依赖默认按体积优先优化（"s"），热路径 crate 用下面
# 的具名覆盖保持 opt-level=3。本项目自身的 DSP/FFT/解密代码不受通配符
# 影响（package 覆盖只作用于外部依赖），仍走上面的 opt-level=3。
# 2026-11-12：5656 起汽水歌词跨源聚合等新代码把 arm64 APK 顶破 20MB 上限，
# 依赖侧改按 "s" 优化。symphonia 音频解码子 crate 也走 "s"（现代手机解码
# 实时余量充足）。热路径具名覆盖（勿删）：rustfft 频谱、aes 加密流解密、
# ring TLS、brotli/flate2/miniz_oxide 流缓存压缩解码。
[profile.release.package."*"]
opt-level = "s"

[profile.release.package.rustfft]
opt-level = 3

[profile.release.package.aes]
opt-level = 3

[profile.release.package.ring]
opt-level = 3

[profile.release.package.brotli]
opt-level = 3

[profile.release.package.flate2]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

# AC-4/AV3A 解码器统一走通配档 "s"：opt-level=3 曾让 arm64 .so 膨胀，
# APK 顶破 20MiB 红线。解码带超时回退直链，"s" 下速度可接受。
# （ac4/av3a 若未来需要提速再单独评估，优先保体积红线。）
