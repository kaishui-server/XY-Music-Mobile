# 沙箱容器内存有限（~5.8GB），Gradle daemon 超过 ~3GB RSS 会被 cgroup
# OOM killer 杀掉（构建 13 分钟时 daemon 消失的根因）。压缩堆/Metaspace，
# 限制并行 worker，与 Dart AOT 编译共存时留足余量。
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+UseSerialGC
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# 项目路径含非 ASCII 字符（中文），禁用 Android Gradle 插件路径检查 (b.android.com/95744)
android.overridePathCheck=true
# 跳过 release 关键 lint 检查（避免构建时从 dl.google.com 下载 lint 依赖超时）
android.lintVitalCheck=false
# 不从 maven 下载 aapt2，改用本地 build-tools 自带的版本（绕开 AGP 9.0.1 自带 aapt2 daemon 启动失败问题）
android.builder.sdkDownload.aapt2=false
# 沙箱环境无法写 Kotlin daemon 临时目录，改用进程内编译
kotlin.compiler.execution.strategy=in-process
# 兜底：若仍有独立 Kotlin daemon 被拉起，限制其堆大小避免 OOM
kotlin.daemon.jvmargs=-Xmx1024m
# 禁用 Kotlin 增量编译，规避增量缓存文件写入失败（Could not close incremental caches）
kotlin.incremental=false
# 禁止 Flutter 插件清空 defaultConfig.ndk.abiFilters（否则会强制打包全部 ABI，体积膨胀约 6MB）
disable-abi-filtering=true
